# Reasoning-baseline arm: vLLM serving the unquantized Qwen3.5-9B on a
# MIG 3g.71gb H200 slice, thinking mode + ~82k output budget per the
# model card's benchmark guidance. Separate from the llama-server lane so
# the ATLAS routed/baseline arms and this arm can run concurrently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen-think
  namespace: ${ATLAS_NAMESPACE}
  labels:
    app.kubernetes.io/name: vllm-qwen-think
    app.kubernetes.io/part-of: atlas-openshift
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-qwen-think
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-qwen-think
        app.kubernetes.io/part-of: atlas-openshift
        kueue.x-k8s.io/queue-name: ${ATLAS_KUEUE_QUEUE}
    spec:
      nodeSelector:
        ${ATLAS_GPU_NODE_SELECTOR_KEY}: "${ATLAS_GPU_NODE_SELECTOR_VALUE}"
      tolerations:
      - key: "${ATLAS_GPU_TOLERATION_KEY}"
        operator: Equal
        value: "${ATLAS_GPU_TOLERATION_VALUE}"
        effect: "${ATLAS_GPU_TOLERATION_EFFECT}"
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai:latest
        args:
        - --model=Qwen/Qwen3.5-9B
        - --max-model-len=98304
        - --gpu-memory-utilization=0.90
        - --reasoning-parser=qwen3
        - --host=0.0.0.0
        - --port=8000
        env:
        - {name: HF_HOME, value: "/cache/hf"}
        ports:
        - {name: http, containerPort: 8000}
        volumeMounts:
        - {name: cache, mountPath: /cache}
        - {name: shm, mountPath: /dev/shm}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 60
        resources:
          requests:
            cpu: 8
            memory: 48Gi
            nvidia.com/mig-3g.71gb: 1
          limits:
            cpu: 12
            memory: 64Gi
            nvidia.com/mig-3g.71gb: 1
      volumes:
      - name: cache
        emptyDir: {sizeLimit: 60Gi}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-think
  namespace: ${ATLAS_NAMESPACE}
  labels:
    app.kubernetes.io/name: vllm-qwen-think
spec:
  selector:
    app.kubernetes.io/name: vllm-qwen-think
  ports:
  - {name: http, port: 8000, targetPort: 8000}
